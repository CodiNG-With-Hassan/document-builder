<div class="flex flex-col gap-2">
  <span class="text-sm font-medium">{{ 'BUILDER.WIDGETS.IMAGE.SOURCE' | translate }}</span>
  <label
    for="image-widget-file"
    class="flex cursor-pointer items-center justify-center gap-2 rounded-md border border-dashed border-[var(--p-surface-300)] px-3 py-2 text-sm hover:border-[var(--p-primary-color)]"
  >
    <i class="pi pi-upload" aria-hidden="true"></i>
    {{ 'BUILDER.WIDGETS.IMAGE.UPLOAD' | translate }}
  </label>
  <input
    id="image-widget-file"
    type="file"
    accept="image/*"
    class="sr-only"
    (change)="onFileSelected($event)"
  />
  @if (uploadError(); as error) {
    <p class="text-xs text-[var(--p-red-500)]" role="alert">{{ error | translate }}</p>
  }
  @if (isUpload()) {
    <div class="flex items-center justify-between text-sm text-[var(--p-surface-600)]">
      <span>{{ 'BUILDER.WIDGETS.IMAGE.UPLOADED' | translate }}</span>
      <p-button
        size="small"
        severity="secondary"
        [text]="true"
        [label]="'BUILDER.WIDGETS.IMAGE.REMOVE' | translate"
        (onClick)="removeImage()"
      />
    </div>
  } @else {
    <label for="image-widget-url" class="text-xs text-[var(--p-surface-500)]">
      {{ 'BUILDER.WIDGETS.IMAGE.OR_URL' | translate }}
    </label>
    <input
      pInputText
      id="image-widget-url"
      type="url"
      class="w-full"
      autocomplete="off"
      placeholder="https://"
      [formField]="imageForm.url"
      (input)="onFieldInput('url', $event)"
      (blur)="commit.emit()"
    />
  }
</div>

<div>
  <label for="image-widget-caption" class="mb-1 block text-sm font-medium">
    {{ 'BUILDER.WIDGETS.IMAGE.CAPTION' | translate }}
  </label>
  <input
    pInputText
    id="image-widget-caption"
    class="w-full"
    autocomplete="off"
    [formField]="imageForm.caption"
    (input)="onFieldInput('caption', $event)"
    (blur)="commit.emit()"
  />
</div>

<div>
  <label for="image-widget-href" class="mb-1 block text-sm font-medium">
    {{ 'BUILDER.WIDGETS.IMAGE.OPENS' | translate }}
  </label>
  <input
    pInputText
    id="image-widget-href"
    type="url"
    class="w-full"
    autocomplete="off"
    placeholder="https://"
    [formField]="imageForm.href"
    (input)="onFieldInput('href', $event)"
    (blur)="commit.emit()"
  />
</div>

<div>
  <span class="mb-1 block text-sm font-medium">{{ 'BUILDER.WIDGETS.IMAGE.FIT' | translate }}</span>
  <p-button-group role="group" [attr.aria-label]="'BUILDER.WIDGETS.IMAGE.FIT' | translate">
    @for (option of fits; track option.fit) {
      <p-button
        size="small"
        [label]="option.labelKey | translate"
        [severity]="widget().value.config.fit === option.fit ? 'primary' : 'secondary'"
        [outlined]="widget().value.config.fit !== option.fit"
        [attr.aria-pressed]="widget().value.config.fit === option.fit"
        (onClick)="setFit(option.fit)"
      />
    }
  </p-button-group>
</div>
